# Keeps pinned image tags and GitHub Actions up to date via pull requests.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      grafana-stack:
        patterns: ["grafana/*", "prom/*", "prometheuscommunity/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
