apiVersion: 1

providers:
  - name: planet-pulse
    type: file
    disableDeletion: true
    # true = dashboards can be edited and saved in the Grafana UI.
    # Export the JSON back to grafana/dashboards/ to keep changes in the repo.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
